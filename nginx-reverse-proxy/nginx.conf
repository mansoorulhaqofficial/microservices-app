events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    # Upstream servers
    upstream frontend {
        server frontend-service:80;
    }
    
    upstream users {
        server user-service:3000;
    }
    
    upstream products {
        server product-service:3000;
    }
    server {
    listen 80;
    server_name frontend.postifycreative.com user.postifycreative.com products.postifycreative.com;
    return 301 https://$host$request_uri;
    }
    # Frontend service (frontend.postifycreative.com)
    server {
        listen 443 ssl;
        server_name frontend.postifycreative.com;
        ssl_certificate /etc/letsencrypt/live/frontend.postifycreative.com/fullchain.pem;
       	ssl_certificate_key /etc/letsencrypt/live/frontend.postifycreative.com/privkey.pem;	
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # User service (user.postifycreative.com)
    server {
        listen 443 ssl;
        server_name user.postifycreative.com;
        ssl_certificate /etc/letsencrypt/live/frontend.postifycreative.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/frontend.postifycreative.com/privkey.pem;
        # Apply rate limiting to API
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # Product service (products.postifycreative.com)
    server {
        listen 443 ssl;
        server_name products.postifycreative.com;
        ssl_certificate /etc/letsencrypt/live/frontend.postifycreative.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/frontend.postifycreative.com/privkey.pem;
        # Apply rate limiting to API
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # Default server block - return 404 for undefined domains
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}
